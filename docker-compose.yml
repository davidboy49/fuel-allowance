services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # only the reverse proxy (Caddy) reaches the app
    environment:
      DATABASE_URL: file:/data/fuel.db
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    volumes:
      - fuel-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
volumes:
  fuel-data:
  caddy-data:
